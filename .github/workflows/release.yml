name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag and project versions
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";

            const packageVersion = JSON.parse(
              readFileSync("package.json", "utf8"),
            ).version;
            const tauriVersion = JSON.parse(
              readFileSync("src-tauri/tauri.conf.json", "utf8"),
            ).version;
            const cargoManifest = readFileSync("src-tauri/Cargo.toml", "utf8");
            const cargoVersion = cargoManifest.match(
              /^version = "([^"]+)"/m,
            )?.[1];
            const expectedTag = `v${packageVersion}`;

            if (
              packageVersion !== tauriVersion ||
              packageVersion !== cargoVersion
            ) {
              throw new Error(
                `Version mismatch: package=${packageVersion}, tauri=${tauriVersion}, cargo=${cargoVersion}`,
              );
            }

            if (process.env.RELEASE_TAG !== expectedTag) {
              throw new Error(
                `Release tag ${process.env.RELEASE_TAG} must equal ${expectedTag}`,
              );
            }
          '

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: x86_64-unknown-linux-gnu
            args: >-
              --target x86_64-unknown-linux-gnu
              --bundles deb,appimage
          - name: Windows x64
            platform: windows-2022
            rust_targets: x86_64-pc-windows-msvc
            args: >-
              --target x86_64-pc-windows-msvc
              --bundles nsis,msi
          - name: macOS Universal
            platform: macos-14
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: >-
              --target universal-apple-darwin
              --bundles dmg

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 11

      - uses: actions/setup-node@v4
        with:
          cache: pnpm
          node-version: 22

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build bundle and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}
          prerelease: false
          releaseBody: |
            Download the installer for your operating system from the assets below.
          releaseDraft: true
          releaseName: QQ Chat History ${{ env.RELEASE_TAG }}
          tagName: ${{ env.RELEASE_TAG }}

  publish:
    name: Publish complete release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release edit "$RELEASE_TAG" \
            --draft=false \
            --repo "$GITHUB_REPOSITORY"
